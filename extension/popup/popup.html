<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <title>Echo</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>

    <div class="header">
        <div class="logo">
            <img class="logo-img" src="../icons/icon48.png" alt="" />
            <span class="logo-text">echo</span>
        </div>
        <button id="themeBtn" class="theme-btn" type="button" aria-label="Switch light or dark mode">◐</button>
    </div>

    <h1 class="headline">Be in the meeting.<br /><span class="grad">Echo takes the notes.</span></h1>

    <div id="statusPill" class="pill pill-idle">
        <span class="pill-dot"></span>
        <span id="statusText">Ready</span>
    </div>

    <div id="meetingInfo" class="meeting-info" style="display:none">
        <div class="info-row">
            <span class="info-label">Meeting</span>
            <span id="meetingIdText" class="info-value code">—</span>
        </div>
        <div class="info-row">
            <span class="info-label">Duration</span>
            <span id="durationText" class="info-value">00:00</span>
        </div>
    </div>

    <div id="errorBox" class="error-box" style="display:none">
        <span id="errorText"></span>
    </div>

    <div class="actions">
        <button id="startBtn" class="btn btn-start">Start recording</button>
        <button id="stopBtn"  class="btn btn-stop"  style="display:none">Stop recording</button>
        <a id="dashBtn" class="btn btn-ghost" href="http://localhost:3000/dashboard" target="_blank" rel="noreferrer">Open dashboard</a>
    </div>

    <div class="footer">
        <span id="footerHint">Open Google Meet, then click Start.</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
